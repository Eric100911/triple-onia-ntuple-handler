[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multileppat-vertex-batch"
version = "0.1.0"
description = "Batch ntuple utilities for MultiLepPAT Run-3 mass studies."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "awkward",
  "iminuit",
  "matplotlib",
  "mplhep",
  "numpy",
  "pandas",
  "scipy",
  "uproot",
]

[project.scripts]
run-multileppat-vertex-batch = "multileppat_vertex_batch.cli_batch:main"
run-multileppat-truth-cache = "multileppat_vertex_batch.cli_truth_cache:main"
run-multileppat-efficiency = "multileppat_vertex_batch.cli_efficiency:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
